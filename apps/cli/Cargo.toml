[package]
name = "palexus"
version = "1.0.0"
edition = "2021"
description = "PALEXUS CLI — scan, import, project, sync, doctor, snapshot, and rollback AI tool configs"
default-run = "palexus"

[[bin]]
name = "palexus"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
palexus-core = { path = "../../packages/core" }
serde_json = "1.0"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
